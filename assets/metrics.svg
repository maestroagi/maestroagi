<svg xmlns="http://www.w3.org/2000/svg" width="850" height="180" viewBox="0 0 850 180">
  <defs>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-card">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes led-pulse { 0%,100% { opacity:0.4; r:4; } 50% { opacity:1; r:5; } }
    @keyframes scanline { 0% { transform: translateY(-180px); } 100% { transform: translateY(180px); } }
    @keyframes card-glow1 { 0%,100% { stroke-opacity:0.3; } 50% { stroke-opacity:0.7; } }
    @keyframes card-glow2 { 0%,100% { stroke-opacity:0.3; } 50% { stroke-opacity:0.7; } }
    @keyframes card-glow3 { 0%,100% { stroke-opacity:0.3; } 50% { stroke-opacity:0.7; } }
    @keyframes card-glow4 { 0%,100% { stroke-opacity:0.3; } 50% { stroke-opacity:0.7; } }
    .bg { fill: #0D1117; }
    .sys-title { font-family: 'Courier New', monospace; font-size: 13px; fill: #00FF88; font-weight: bold; filter: url(#glow-green); }
    .card-bg { fill: #161B22; rx: 6; }
    .card1 { stroke: #00D9FF; stroke-width: 1; animation: card-glow1 4s ease-in-out infinite; }
    .card2 { stroke: #BD00FF; stroke-width: 1; animation: card-glow2 4s ease-in-out infinite 1s; }
    .card3 { stroke: #00FF88; stroke-width: 1; animation: card-glow3 4s ease-in-out infinite 2s; }
    .card4 { stroke: #00D9FF; stroke-width: 1; animation: card-glow4 4s ease-in-out infinite 3s; }
    .card-title { font-family: 'Courier New', monospace; font-size: 11px; fill: #C9D1D9; font-weight: bold; }
    .card-value { font-family: 'Courier New', monospace; font-size: 10px; fill: #8B949E; }
    .card-icon { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif; font-size: 18px; }
    .led { fill: #00FF88; animation: led-pulse 2s ease-in-out infinite; }
    .led2 { fill: #00FF88; animation: led-pulse 2s ease-in-out infinite 0.5s; }
    .led3 { fill: #00FF88; animation: led-pulse 2s ease-in-out infinite 1s; }
    .led4 { fill: #00FF88; animation: led-pulse 2s ease-in-out infinite 1.5s; }
    .scanline { fill: rgba(0, 217, 255, 0.03); animation: scanline 6s linear infinite; }
    .timestamp { font-family: 'Courier New', monospace; font-size: 9px; fill: #30363D; }
  </style>

  <!-- Background -->
  <rect width="850" height="180" class="bg" rx="6"/>
  <rect width="848" height="178" x="1" y="1" fill="none" stroke="#30363D" stroke-width="1" rx="6" opacity="0.5"/>

  <!-- Scanline effect -->
  <rect x="0" y="0" width="850" height="4" class="scanline" rx="0"/>

  <!-- Title -->
  <text x="30" y="32" class="sys-title">// SYSTEM METRICS</text>
  <text x="820" y="32" text-anchor="end" class="timestamp">UPTIME: 99.9%</text>

  <!-- Card 1: Autonomous Agents -->
  <g>
    <rect x="25" y="50" width="190" height="110" class="card-bg card1" rx="6"/>
    <circle cx="185" cy="68" r="4" class="led"/>
    <text x="45" y="85" class="card-icon">&#x1F916;</text>
    <text x="75" y="85" class="card-title">Autonomous</text>
    <text x="75" y="100" class="card-title">Agents</text>
    <text x="45" y="130" class="card-value">Status: Active</text>
    <text x="45" y="145" class="card-value">&amp; Running</text>
  </g>

  <!-- Card 2: CI/CD Pipelines -->
  <g>
    <rect x="230" y="50" width="190" height="110" class="card-bg card2" rx="6"/>
    <circle cx="390" cy="68" r="4" class="led2"/>
    <text x="250" y="85" class="card-icon">&#x1F504;</text>
    <text x="280" y="85" class="card-title">CI/CD</text>
    <text x="280" y="100" class="card-title">Pipelines</text>
    <text x="250" y="130" class="card-value">Status: Fully</text>
    <text x="250" y="145" class="card-value">Automated</text>
  </g>

  <!-- Card 3: OpenClaw -->
  <g>
    <rect x="435" y="50" width="190" height="110" class="card-bg card3" rx="6"/>
    <circle cx="595" cy="68" r="4" class="led3"/>
    <text x="455" y="85" class="card-icon">&#x1F99E;</text>
    <text x="485" y="85" class="card-title">OpenClaw</text>
    <text x="485" y="100" class="card-title">Fork</text>
    <text x="455" y="130" class="card-value">Status: Custom</text>
    <text x="455" y="145" class="card-value">Fork Live</text>
  </g>

  <!-- Card 4: Deploy Status -->
  <g>
    <rect x="640" y="50" width="185" height="110" class="card-bg card4" rx="6"/>
    <circle cx="795" cy="68" r="4" class="led4"/>
    <text x="660" y="85" class="card-icon">&#x1F4E1;</text>
    <text x="690" y="85" class="card-title">Deploy</text>
    <text x="690" y="100" class="card-title">Status</text>
    <text x="660" y="130" class="card-value">All Systems</text>
    <text x="660" y="145" class="card-value">Go</text>
  </g>
</svg>