<svg xmlns="http://www.w3.org/2000/svg" width="850" height="140" viewBox="0 0 850 140">
  <defs>
    <filter id="ts-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="pipe-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#BD00FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes dash-flow { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
    @keyframes pulse-badge { 0%,100% { transform: scale(1); opacity:0.85; } 50% { transform: scale(1.03); opacity:1; } }
    @keyframes data-packet1 { 0% { transform: translateX(0); opacity:0; } 10% { opacity:1; } 90% { opacity:1; } 100% { transform: translateX(710px); opacity:0; } }
    @keyframes data-packet2 { 0% { transform: translateX(0); opacity:0; } 10% { opacity:0.6; } 90% { opacity:0.6; } 100% { transform: translateX(710px); opacity:0; } }
    .flow-line { stroke-dasharray: 10 6; animation: dash-flow 2s linear infinite; }
    .badge { rx: 10; fill: #161B22; stroke-width: 1.5; }
    .badge-label { font-family: 'Courier New', monospace; font-size: 10px; font-weight: bold; }
    .badge-name { font-family: 'Courier New', monospace; font-size: 11px; fill: #C9D1D9; font-weight: bold; }
    .top-label { font-family: 'Courier New', monospace; font-size: 10px; fill: #484F58; }
    .b1 { animation: pulse-badge 4s ease-in-out infinite; transform-origin: 70px 72px; }
    .b2 { animation: pulse-badge 4s ease-in-out infinite 0.4s; transform-origin: 185px 72px; }
    .b3 { animation: pulse-badge 4s ease-in-out infinite 0.8s; transform-origin: 305px 72px; }
    .b4 { animation: pulse-badge 4s ease-in-out infinite 1.2s; transform-origin: 440px 72px; }
    .b5 { animation: pulse-badge 4s ease-in-out infinite 1.6s; transform-origin: 565px 72px; }
    .b6 { animation: pulse-badge 4s ease-in-out infinite 2s; transform-origin: 670px 72px; }
    .b7 { animation: pulse-badge 4s ease-in-out infinite 2.4s; transform-origin: 783px 72px; }
    .dp1 { animation: data-packet1 5s linear infinite; }
    .dp2 { animation: data-packet2 5s linear infinite 2.5s; }
  </style>

  <!-- Background -->
  <rect width="850" height="140" fill="#0D1117" rx="8"/>
  <rect width="848" height="138" x="1" y="1" fill="none" stroke="#30363D" stroke-width="1" rx="8" opacity="0.4"/>

  <!-- Pipeline background bar -->
  <rect x="40" y="67" width="770" height="10" rx="5" fill="url(#pipe-grad)"/>

  <!-- Main flow line -->
  <line x1="65" y1="72" x2="810" y2="72" class="flow-line" stroke="#30363D" stroke-width="1"/>

  <!-- Data packets traveling the pipeline -->
  <circle cx="60" cy="72" r="2" fill="#00D9FF" class="dp1"/>
  <circle cx="60" cy="72" r="2" fill="#BD00FF" class="dp2"/>

  <!-- Title -->
  <text x="425" y="24" text-anchor="middle" class="top-label">// DATA PIPELINE v2.0</text>

  <!-- Connection arrows between badges -->
  <polygon points="123,68 130,72 123,76" fill="#3776AB" opacity="0.5"/>
  <polygon points="240,68 247,72 240,76" fill="#3178C6" opacity="0.5"/>
  <polygon points="362,68 369,72 362,76" fill="#2496ED" opacity="0.5"/>
  <polygon points="500,68 507,72 500,76" fill="#2088FF" opacity="0.5"/>
  <polygon points="618,68 625,72 618,76" fill="#FCC624" opacity="0.5"/>
  <polygon points="722,68 729,72 722,76" fill="#4EAA25" opacity="0.5"/>

  <!-- Python -->
  <g class="b1">
    <rect x="30" y="44" width="80" height="56" class="badge" stroke="#3776AB"/>
    <circle cx="50" cy="66" r="10" fill="#3776AB" opacity="0.2"/>
    <text x="50" y="70" text-anchor="middle" class="badge-label" fill="#3776AB">PY</text>
    <text x="87" y="70" text-anchor="middle" class="badge-name">Python</text>
    <text x="70" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="7" fill="#484F58">3.12</text>
  </g>

  <!-- TypeScript -->
  <g class="b2">
    <rect x="140" y="44" width="96" height="56" class="badge" stroke="#3178C6"/>
    <circle cx="162" cy="66" r="10" fill="#3178C6" opacity="0.2"/>
    <text x="162" y="70" text-anchor="middle" class="badge-label" fill="#3178C6">TS</text>
    <text x="207" y="70" text-anchor="middle" class="badge-name">TypeScript</text>
    <text x="188" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="7" fill="#484F58">5.x</text>
  </g>

  <!-- Docker -->
  <g class="b3">
    <rect x="260" y="44" width="88" height="56" class="badge" stroke="#2496ED"/>
    <circle cx="282" cy="66" r="10" fill="#2496ED" opacity="0.2"/>
    <text x="282" y="70" text-anchor="middle" class="badge-label" fill="#2496ED">DK</text>
    <text x="320" y="70" text-anchor="middle" class="badge-name">Docker</text>
    <text x="304" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="7" fill="#484F58">compose</text>
  </g>

  <!-- GitHub Actions -->
  <g class="b4">
    <rect x="372" y="44" width="114" height="56" class="badge" stroke="#2088FF"/>
    <circle cx="394" cy="66" r="10" fill="#2088FF" opacity="0.2"/>
    <text x="394" y="70" text-anchor="middle" class="badge-label" fill="#2088FF">GA</text>
    <text x="446" y="70" text-anchor="middle" class="badge-name">GH Actions</text>
    <text x="429" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="7" fill="#484F58">CI/CD</text>
  </g>

  <!-- Linux -->
  <g class="b5">
    <rect x="510" y="44" width="80" height="56" class="badge" stroke="#FCC624"/>
    <circle cx="532" cy="66" r="10" fill="#FCC624" opacity="0.2"/>
    <text x="532" y="70" text-anchor="middle" class="badge-label" fill="#FCC624">LX</text>
    <text x="566" y="70" text-anchor="middle" class="badge-name">Linux</text>
    <text x="550" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="7" fill="#484F58">kernel</text>
  </g>

  <!-- Bash -->
  <g class="b6">
    <rect x="618" y="44" width="76" height="56" class="badge" stroke="#4EAA25"/>
    <circle cx="640" cy="66" r="10" fill="#4EAA25" opacity="0.2"/>
    <text x="640" y="70" text-anchor="middle" class="badge-label" fill="#4EAA25">SH</text>
    <text x="672" y="70" text-anchor="middle" class="badge-name">Bash</text>
    <text x="656" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="7" fill="#484F58">shell</text>
  </g>

  <!-- Node.js -->
  <g class="b7">
    <rect x="722" y="44" width="100" height="56" class="badge" stroke="#339933"/>
    <circle cx="744" cy="66" r="10" fill="#339933" opacity="0.2"/>
    <text x="744" y="70" text-anchor="middle" class="badge-label" fill="#339933">NJ</text>
    <text x="788" y="70" text-anchor="middle" class="badge-name">Node.js</text>
    <text x="772" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="7" fill="#484F58">runtime</text>
  </g>

  <!-- Bottom info line -->
  <text x="425" y="132" text-anchor="middle" class="top-label">stack.config // production-ready</text>
</svg>