<svg xmlns="http://www.w3.org/2000/svg" width="850" height="250" viewBox="0 0 850 250">
  <defs>
    <filter id="glow-center">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-node">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes center-pulse { 0%,100% { r:38; opacity:0.15; } 50% { r:44; opacity:0.25; } }
    @keyframes node-pulse1 { 0%,100% { opacity:0.7; } 50% { opacity:1; } }
    @keyframes node-pulse2 { 0%,100% { opacity:0.7; } 50% { opacity:1; } }
    @keyframes node-pulse3 { 0%,100% { opacity:0.7; } 50% { opacity:1; } }
    @keyframes node-pulse4 { 0%,100% { opacity:0.7; } 50% { opacity:1; } }
    @keyframes travel1 { 0% { offset-distance: 0%; opacity:1; } 100% { offset-distance: 100%; opacity:1; } }
    @keyframes travel2 { 0% { offset-distance: 0%; opacity:1; } 100% { offset-distance: 100%; opacity:1; } }
    @keyframes travel3 { 0% { offset-distance: 0%; opacity:1; } 100% { offset-distance: 100%; opacity:1; } }
    @keyframes travel4 { 0% { offset-distance: 0%; opacity:1; } 100% { offset-distance: 100%; opacity:1; } }
    @keyframes dash-anim { 0% { stroke-dashoffset: 16; } 100% { stroke-dashoffset: 0; } }
    .bg { fill: #0D1117; }
    .center-glow { fill: #00D9FF; animation: center-pulse 3s ease-in-out infinite; }
    .center-ring { fill: #161B22; stroke: #00D9FF; stroke-width: 2; filter: url(#glow-center); }
    .center-text { font-family: 'Courier New', monospace; font-size: 10px; fill: #FFFFFF; font-weight: bold; }
    .node-bg { fill: #161B22; stroke-width: 1.5; rx: 8; }
    .node1 { stroke: #00FF88; animation: node-pulse1 3s ease-in-out infinite; }
    .node2 { stroke: #BD00FF; animation: node-pulse2 3s ease-in-out infinite 0.7s; }
    .node3 { stroke: #00D9FF; animation: node-pulse3 3s ease-in-out infinite 1.4s; }
    .node4 { stroke: #FCC624; animation: node-pulse4 3s ease-in-out infinite 2.1s; }
    .node-title { font-family: 'Courier New', monospace; font-size: 11px; fill: #C9D1D9; font-weight: bold; }
    .node-desc { font-family: 'Courier New', monospace; font-size: 9px; fill: #8B949E; }
    .conn-line { stroke-dasharray: 6 4; animation: dash-anim 2s linear infinite; fill: none; stroke-width: 1.5; }
    .conn1 { stroke: #00FF88; }
    .conn2 { stroke: #BD00FF; }
    .conn3 { stroke: #00D9FF; }
    .conn4 { stroke: #FCC624; }
    .dot-travel { r: 2.5; }
    .icon { font-size: 16px; }
  </style>

  <!-- Background -->
  <rect width="850" height="250" class="bg" rx="6"/>
  <rect width="848" height="248" x="1" y="1" fill="none" stroke="#30363D" stroke-width="1" rx="6" opacity="0.5"/>

  <!-- Connection lines from center to nodes -->
  <!-- Center point: 425, 125 -->
  <!-- Node 1 (top-left): 130, 55 -->
  <path d="M 425 125 Q 280 70 195 55" class="conn-line conn1"/>
  <!-- Node 2 (top-right): 680, 55 -->
  <path d="M 425 125 Q 560 70 655 55" class="conn-line conn2"/>
  <!-- Node 3 (bottom-left): 130, 195 -->
  <path d="M 425 125 Q 280 180 195 195" class="conn-line conn3"/>
  <!-- Node 4 (bottom-right): 680, 195 -->
  <path d="M 425 125 Q 560 180 655 195" class="conn-line conn4"/>

  <!-- Traveling dots on connections -->
  <circle r="2.5" fill="#00FF88">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 425 125 Q 280 70 195 55"/>
  </circle>
  <circle r="2" fill="#00FF88" opacity="0.5">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 425 125 Q 280 70 195 55" begin="1.5s"/>
  </circle>
  <circle r="2.5" fill="#BD00FF">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 425 125 Q 560 70 655 55"/>
  </circle>
  <circle r="2" fill="#BD00FF" opacity="0.5">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 425 125 Q 560 70 655 55" begin="1.5s"/>
  </circle>
  <circle r="2.5" fill="#00D9FF">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 425 125 Q 280 180 195 195"/>
  </circle>
  <circle r="2" fill="#00D9FF" opacity="0.5">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 425 125 Q 280 180 195 195" begin="1.7s"/>
  </circle>
  <circle r="2.5" fill="#FCC624">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 425 125 Q 560 180 655 195"/>
  </circle>
  <circle r="2" fill="#FCC624" opacity="0.5">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 425 125 Q 560 180 655 195" begin="1.7s"/>
  </circle>

  <!-- Center node -->
  <circle cx="425" cy="125" r="38" class="center-glow"/>
  <circle cx="425" cy="125" r="32" class="center-ring"/>
  <text x="425" y="122" text-anchor="middle" class="center-text">MAESTRO</text>
  <text x="425" y="135" text-anchor="middle" class="center-text">AGI</text>

  <!-- Node 1: OpenClaw (top-left) -->
  <g class="node1">
    <rect x="60" y="30" width="195" height="52" class="node-bg" stroke="#00FF88" rx="8"/>
    <text x="80" y="55" class="icon">&#x1F99E;</text>
    <text x="100" y="53" class="node-title">OpenClaw</text>
    <text x="80" y="72" class="node-desc">Custom AI Assistant Fork</text>
  </g>

  <!-- Node 2: Agent Suite (top-right) -->
  <g class="node2">
    <rect x="595" y="30" width="195" height="52" class="node-bg" stroke="#BD00FF" rx="8"/>
    <text x="615" y="55" class="icon">&#x1F916;</text>
    <text x="635" y="53" class="node-title">Agent Suite</text>
    <text x="615" y="72" class="node-desc">Autonomous Python Agents</text>
  </g>

  <!-- Node 3: Web Deployments (bottom-left) -->
  <g class="node3">
    <rect x="60" y="170" width="195" height="52" class="node-bg" stroke="#00D9FF" rx="8"/>
    <text x="80" y="195" class="icon">&#x1F310;</text>
    <text x="100" y="193" class="node-title">Web Deployments</text>
    <text x="80" y="212" class="node-desc">Landing Pages &amp; Sites</text>
  </g>

  <!-- Node 4: CI/CD Engine (bottom-right) -->
  <g class="node4">
    <rect x="595" y="170" width="195" height="52" class="node-bg" stroke="#FCC624" rx="8"/>
    <text x="615" y="195" class="icon">&#x2699;&#xFE0F;</text>
    <text x="635" y="193" class="node-title">CI/CD Engine</text>
    <text x="615" y="212" class="node-desc">GitHub Actions + Docker</text>
  </g>
</svg>